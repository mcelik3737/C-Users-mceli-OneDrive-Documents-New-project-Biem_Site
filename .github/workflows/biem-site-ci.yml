name: BIEM Site CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: biem-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validate Natro PHP endpoint
        run: php -l public/api/contact.php

      - name: Production build
        run: npm run build

      - name: Verify Natro output
        run: |
          test -f dist/index.html
          test -f dist/.htaccess
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/api/contact.php
          test -f dist/rf-repeater-bda-urunleri.html
          test -f dist/maden-tunel-haberlesmesi.html
          test -f dist/iletisim.html
          test -d dist/assets/images
          test -d dist/assets/docs

      - name: Upload Natro deployment package
        uses: actions/upload-artifact@v4
        with:
          name: biem-natro-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
